<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      background: #1e1e1e;
      color: #ccc;
    }
    .header {
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #e0e0e0;
      border-bottom: 1px solid #333;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid #333;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.connected { background: #4caf50; }
    .dot.disconnected { background: #f44336; }
    .dot.disabled { background: #666; }
    .status-text { flex: 1; }
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: #555;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .toggle input:checked + .toggle-track {
      background: #4caf50;
    }
    .toggle-knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
      pointer-events: none;
    }
    .toggle input:checked ~ .toggle-knob {
      transform: translateX(16px);
    }
    .activity-list {
      max-height: 240px;
      overflow-y: auto;
    }
    .activity-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-bottom: 1px solid #2a2a2a;
    }
    .activity-icon { font-size: 12px; flex-shrink: 0; }
    .activity-icon.ok { color: #4caf50; }
    .activity-icon.fail { color: #f44336; }
    .activity-name { flex: 1; font-family: monospace; font-size: 12px; }
    .activity-time { color: #888; font-size: 11px; flex-shrink: 0; }
    .empty {
      padding: 16px;
      text-align: center;
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="header">commandGarden</div>
  <div class="status-row">
    <div id="dot" class="dot disabled"></div>
    <span id="status-text" class="status-text">Checking…</span>
    <label class="toggle">
      <input type="checkbox" id="toggle-input">
      <div class="toggle-track"></div>
      <div class="toggle-knob"></div>
    </label>
  </div>
  <div id="activity" class="activity-list"></div>
  <script src="popup.js"></script>
</body>
</html>
