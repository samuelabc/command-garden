<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      background: #1e1e1e;
      color: #ccc;
    }
    .header {
      padding: 12px 16px;
      font-family: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
      color: #e0e0e0;
      border-bottom: 1px solid #333;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid #333;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.connected { background: #4caf50; }
    .dot.disconnected { background: #f44336; }
    .dot.disabled { background: #666; }
    .status-text { flex: 1; }
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: #555;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .toggle input:checked + .toggle-track {
      background: #4caf50;
    }
    .toggle-knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
      pointer-events: none;
    }
    .toggle input:checked ~ .toggle-knob {
      transform: translateX(16px);
    }
    .activity-list {
      max-height: 240px;
      overflow-y: auto;
    }
    .activity-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-bottom: 1px solid #2a2a2a;
      transition: background 0.1s;
    }
    .activity-item:hover {
      background: #252525;
    }
    .activity-icon { font-size: 12px; flex-shrink: 0; }
    .activity-icon.ok { color: #4caf50; }
    .activity-icon.fail { color: #f44336; }
    .activity-name { flex: 1; font-family: monospace; font-size: 12px; }
    .activity-time { color: #888; font-size: 11px; flex-shrink: 0; }
    .empty {
      padding: 16px;
      text-align: center;
      color: #666;
      font-style: italic;
    }
    /* Approval section */
    .approval-section {
      border-bottom: 1px solid #333;
      background: #252525;
    }
    .approval-header {
      padding: 10px 16px 4px;
      font-size: 12px;
      font-weight: 600;
      color: #ccc;
    }
    .approval-count {
      display: inline-block;
      font-size: 10px;
      min-width: 16px;
      text-align: center;
      padding: 0 5px;
      line-height: 16px;
      border-radius: 8px;
      background: rgba(245, 158, 11, 0.18);
      color: #F59E0B;
      font-weight: 700;
      margin-left: 6px;
      vertical-align: 1px;
    }
    .approval-card {
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .approval-card + .approval-card {
      border-top: 1px solid #2a2a2a;
    }
    .approval-connector {
      font-family: monospace;
      font-size: 12px;
      color: #e0e0e0;
    }
    .approval-detail {
      font-size: 11px;
      color: #999;
    }
    .approval-cap {
      display: inline-block;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      background: rgba(245, 158, 11, 0.15);
      color: #F59E0B;
      font-family: monospace;
    }
    .approval-actions {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }
    .btn-approve, .btn-reject {
      font-size: 11px;
      padding: 4px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s, color 0.15s;
    }
    .btn-approve {
      background: #4caf50;
      color: #fff;
    }
    .btn-approve:hover { background: #43a047; }
    .btn-approve:active { background: #388e3c; }
    .btn-reject {
      background: transparent;
      color: #999;
      border: 1px solid #555;
    }
    .btn-reject:hover { background: #333; color: #ccc; }
    .btn-reject:active { background: #2a2a2a; }
  </style>
</head>
<body>
  <div class="header">commandGarden</div>
  <div class="status-row">
    <div id="dot" class="dot disabled"></div>
    <span id="status-text" class="status-text">Checking…</span>
    <label class="toggle">
      <input type="checkbox" id="toggle-input">
      <div class="toggle-track"></div>
      <div class="toggle-knob"></div>
    </label>
  </div>
  <div id="approvals"></div>
  <div id="activity" class="activity-list"></div>
  <script src="popup.js"></script>
</body>
</html>
