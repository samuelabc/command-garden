<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      background: #1e1e1e;
      color: #ccc;
    }
    .header {
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #e0e0e0;
      border-bottom: 1px solid #333;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid #333;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.connected { background: #4caf50; }
    .dot.disconnected { background: #f44336; }
    .status-text { flex: 1; }
    .reconnect-btn {
      background: #333;
      color: #ccc;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .reconnect-btn:hover { background: #444; }
    .activity-list {
      max-height: 240px;
      overflow-y: auto;
    }
    .activity-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-bottom: 1px solid #2a2a2a;
    }
    .activity-icon { font-size: 12px; flex-shrink: 0; }
    .activity-icon.ok { color: #4caf50; }
    .activity-icon.fail { color: #f44336; }
    .activity-name { flex: 1; font-family: monospace; font-size: 12px; }
    .activity-time { color: #888; font-size: 11px; flex-shrink: 0; }
    .empty {
      padding: 16px;
      text-align: center;
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="header">commandGarden</div>
  <div class="status-row">
    <div id="dot" class="dot disconnected"></div>
    <span id="status-text" class="status-text">Checking…</span>
    <button id="reconnect-btn" class="reconnect-btn" style="display:none">Reconnect</button>
  </div>
  <div id="activity" class="activity-list"></div>
  <script src="popup.js"></script>
</body>
</html>
