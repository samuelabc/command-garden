site: tokenmaster
name: clients-list
version: "2.0"
description: "List the clients managed by the current user in TokenMaster"
access: read

vars:
  domains:
    emea: tma.query.api.dvb.corpinter.net
    amap: tma.query.api.am.dvb.corpinter.net
    cn: tma.query.api.dvb.corpinter.net.cn

args:
  - name: region
    type: string
    required: false
    default: "all"
    enum: [emea, amap, cn]
    help: "Region to query (emea, amap, cn, or 'all' for fan-out). Default: all"

domains:
  - "tma.query.api.dvb.corpinter.net"
  - "tma.query.api.am.dvb.corpinter.net"
  - "tma.query.api.dvb.corpinter.net.cn"
capabilities:
  - navigate
  - cookie_read

columns:
  - name: id
    type: string
  - name: name
    type: string
  - name: status
    type: string
  - name: admins
    type: string

pipeline:
  - step: navigate
    url: "https://${{ args.region | lookup(vars.domains) }}/v1/clients"
  - step: wait
    selector: "body"
    timeout: 30000
  - step: fetch
    url: "https://${{ args.region | lookup(vars.domains) }}/v1/clients"
    method: "GET"
    headers:
      Accept: "application/json"
  - step: map
    fields:
      id: "${{ row.id }}"
      name: "${{ row.name }}"
      status: "${{ row.status }}"
      admins: "${{ row.admins }}"
