site: demo
name: extract-table
version: "1.0"
description: "Extract rows from an HTML table — sample connector for testing"
access: read

domains:
  - "demo.example.com"
capabilities:
  - navigate
  - dom_read

args:
  - name: minScore
    type: number
    required: false
    default: 0
    help: "Minimum score to include in results"

columns:
  - name: name
    type: string
  - name: email
    type: string
  - name: score
    type: number
  - name: status
    type: string

pipeline:
  - step: navigate
    url: "https://demo.example.com/users"
  - step: wait
    selector: "#data-table tbody"
    timeout: 5000
  - step: extract
    selector: "#data-table tbody tr"
    fields:
      name: "td:nth-child(1)"
      email: "td:nth-child(2)"
      rawScore: "td:nth-child(3)"
      status: "td:nth-child(4)"
  - step: map
    fields:
      name: "${{ vars.row.name | trim }}"
      email: "${{ vars.row.email | trim | lower }}"
      score: "${{ vars.row.rawScore | number }}"
      status: "${{ vars.row.status | trim | upper }}"
  - step: filter
    field: score
    operator: gte
    value: "${{ args.minScore }}"
