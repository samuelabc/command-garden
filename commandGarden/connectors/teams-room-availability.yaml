site: teams
name: room-availability
version: "1.0"
description: "Meeting-room free/busy timeline for one room on a given day (Teams/Outlook calendar)"
access: read
cdp: true

domains:
  - "outlook.cloud.microsoft.mcas.ms"
capabilities:
  - navigate
  - js_evaluate

args:
  - name: room
    type: string
    required: true
    help: "Room name or mailbox email (e.g. 'MBTMY The Vista' or 'RES-RERE-M6VJ7ZUW@mercedes-benz.com')"
  - name: date
    type: string
    required: false
    help: "Day to check in YYYY-MM-DD format (default: today)"
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"

columns:
  - name: room
    type: string
  - name: date
    type: string
  - name: state
    type: string
  - name: start
    type: string
  - name: end
    type: string
  - name: durationMin
    type: number

pipeline:
  - step: navigate
    url: "https://outlook.cloud.microsoft.mcas.ms/calendar/deeplink/compose"
  - step: wait
    selector: "body"
    timeout: 30000
  - step: js_evaluate
    file: teams-room-availability.eval.js

