site: gcs
name: kb-pages
version: "2.0"
description: "Page index of the GCS Knowledge Base — titles, URLs, sections, and hierarchy"
access: read

domains:
  - "pages.i.mercedes-benz.com"
capabilities:
  - navigate
  - dom_read
  - dom_write

columns:
  - name: title
    type: string
  - name: url
    type: string
  - name: section
    type: string
  - name: path
    type: string
  - name: depth
    type: number

pipeline:
  - step: navigate
    url: "https://pages.i.mercedes-benz.com/gcs/KB/docs/main/"
  - step: wait
    selector: "aside"
    timeout: 30000
  - step: click_all
    selector: "aside button[aria-expanded='false']"
    pause: 200
    maxRounds: 10
    settle: 300
  - step: extract_tree
    root: "aside > *:nth-child(2)"
    group:
      match: "div:has(> button), section:has(> button)"
      title: ":scope > button"
      children: ":scope > div"
    leaf:
      match: "a[href^='/gcs/KB/']"
      fields:
        title: textContent
        url: href
