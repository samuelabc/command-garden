site: gcs
name: kb-content
version: "2.0"
description: "Retrieve a single GCS Knowledge Base page as Markdown"
access: read

domains:
  - "pages.i.mercedes-benz.com"
capabilities:
  - navigate
  - dom_read

args:
  - name: path
    type: string
    required: true
    help: "Page path from the kb-pages index, e.g. gcs/KB/docs/general-security/edr/"
    pattern: "^gcs/KB/[a-zA-Z0-9_./-]+$"

columns:
  - name: title
    type: string
  - name: path
    type: string
  - name: author
    type: string
  - name: lastUpdated
    type: string
  - name: content
    type: string

pipeline:
  - step: navigate
    url: "https://pages.i.mercedes-benz.com/${{ args.path }}"
  - step: wait
    selector: "article"
    timeout: 30000
  - step: extract
    selector: "article"
    fields:
      title: "h1"
      authorPill: "span.inline-flex"
  - step: extract_html
    selector: "article"
    as: rawHtml
  - step: transform
    type: html_to_markdown
    input: rawHtml
    as: content
  - step: transform
    type: split_metadata
    input: authorPill
    as: meta
    options:
      delimiter: "|"
      fields:
        - author
        - lastUpdated
