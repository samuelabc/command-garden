<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0 !important; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      background: #0a0a0a;
      color: #e5e5e5;
    }
    .header {
      padding: 12px 16px;
      border-bottom: 1px solid #262626;
    }
    .header-title {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #e5e5e5;
    }
    .header-title span {
      font-weight: 400;
      opacity: 0.6;
    }
    .header-sub {
      font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
      font-size: 0.6rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      opacity: 0.4;
      margin-top: 2px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid #262626;
    }
    .dot {
      width: 8px;
      height: 8px;
      flex-shrink: 0;
    }
    .dot.connected { background: #4ade80; }
    .dot.disconnected { background: #f87171; }
    .dot.disabled { background: #737373; }
    .status-text { flex: 1; }
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: #262626;
      transition: background 0.15s;
    }
    .toggle input:checked + .toggle-track {
      background: #4ade80;
    }
    .toggle-knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #e5e5e5;
      transition: transform 0.15s;
      pointer-events: none;
    }
    .toggle input:checked ~ .toggle-knob {
      transform: translateX(16px);
    }
    .activity-list {
      max-height: 240px;
      overflow-y: auto;
    }
    .activity-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-bottom: 1px solid #171717;
      transition: background 0.1s;
    }
    .activity-item:hover {
      background: #171717;
    }
    .activity-icon { font-size: 12px; flex-shrink: 0; }
    .activity-icon.ok { color: #4ade80; }
    .activity-icon.fail { color: #f87171; }
    .activity-name { flex: 1; font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace; font-size: 12px; }
    .activity-time { color: #a3a3a3; font-size: 11px; flex-shrink: 0; }
    .empty {
      padding: 16px;
      text-align: center;
      color: #737373;
      font-style: italic;
    }
    /* Approval section */
    .approval-section {
      border-bottom: 1px solid #262626;
      background: #171717;
    }
    .approval-header {
      padding: 10px 16px 4px;
      font-size: 12px;
      font-weight: 600;
      color: #e5e5e5;
    }
    .approval-count {
      display: inline-block;
      font-size: 10px;
      min-width: 16px;
      text-align: center;
      padding: 0 5px;
      line-height: 16px;
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
      font-weight: 700;
      margin-left: 6px;
      vertical-align: 1px;
    }
    .approval-card {
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .approval-card + .approval-card {
      border-top: 1px solid #262626;
    }
    .approval-connector {
      font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
      font-size: 12px;
      color: #e5e5e5;
    }
    .approval-detail {
      font-size: 11px;
      color: #a3a3a3;
    }
    .approval-cap {
      display: inline-block;
      font-size: 10px;
      padding: 1px 6px;
      background: rgba(251, 191, 36, 0.12);
      color: #fbbf24;
      font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
    }
    .approval-actions {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }
    .btn-approve, .btn-reject {
      font-size: 11px;
      padding: 4px 14px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s, color 0.15s;
    }
    .btn-approve {
      background: #4ade80;
      color: #0a0a0a;
    }
    .btn-approve:hover { background: #22c55e; }
    .btn-approve:active { background: #16a34a; }
    .btn-reject {
      background: transparent;
      color: #a3a3a3;
      border: 1px solid #262626;
    }
    .btn-reject:hover { background: #171717; color: #e5e5e5; }
    .btn-reject:active { background: #262626; }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(229, 229, 229, 0.2); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(229, 229, 229, 0.35); }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title"><span>command</span>Garden</div>
    <div class="header-sub">browser automation</div>
  </div>
  <div class="status-row">
    <div id="dot" class="dot disabled"></div>
    <span id="status-text" class="status-text">Checking…</span>
    <label class="toggle">
      <input type="checkbox" id="toggle-input">
      <div class="toggle-track"></div>
      <div class="toggle-knob"></div>
    </label>
  </div>
  <div id="approvals"></div>
  <div id="activity" class="activity-list"></div>
  <script src="popup.js"></script>
</body>
</html>
