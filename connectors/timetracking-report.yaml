site: timetracking
name: report
version: "1.0"
description: "MBTI Time Tracking monthly report — one row per booking line"
access: read

domains:
  - "timetracking.mercedes-benz-techinnovation.com"
  - "mbti-bam-wzde-prd-ejdchtb0g9afexhr.a01.azurefd.net"
capabilities:
  - navigate
  - js_evaluate
  - network_egress

args:
  - name: month
    type: string
    required: false
    help: "Month in YYYY-MM format (default: current month)"
    pattern: "^\\d{4}-\\d{2}$"

columns:
  - name: month
    type: string
  - name: date
    type: string
  - name: projectId
    type: string
  - name: projectName
    type: string
  - name: category
    type: string
  - name: activity
    type: string
  - name: activityName
    type: string
  - name: hours
    type: number
  - name: status
    type: string
  - name: journalId
    type: string
  - name: lineNumber
    type: number

pipeline:
  - step: navigate
    url: "https://timetracking.mercedes-benz-techinnovation.com/"
  - step: wait
    selector: "body"
    timeout: 10000
  - step: js_evaluate
    file: timetracking-report.eval.js
