site: timetracking
name: projects
version: "1.0"
description: "List the projects and activities the current user can book to today"
access: read

domains:
  - "timetracking.mercedes-benz-techinnovation.com"
  - "mbti-bam-wzde-prd-ejdchtb0g9afexhr.a01.azurefd.net"
capabilities:
  - navigate
  - js_evaluate
  - network_egress

columns:
  - name: projectId
    type: string
  - name: projectName
    type: string
  - name: activityNumber
    type: string
  - name: activityName
    type: string
  - name: category
    type: string
  - name: linePropertyId
    type: string

pipeline:
  - step: navigate
    url: "https://timetracking.mercedes-benz-techinnovation.com/"
  - step: wait
    selector: "body"
    timeout: 10000
  - step: js_evaluate
    file: timetracking-projects.eval.js
