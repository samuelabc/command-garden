site: timetracking
name: projects
version: "1.0"
description: "List all available projects and activities for the current user"
access: read

domains:
  - "timetracking.mercedes-benz-techinnovation.com"
  - "mbti-bam-wzde-prd-ejdchtb0g9afexhr.a01.azurefd.net"
capabilities:
  - navigate
  - js_evaluate
  - network_egress

args:
  - name: month
    type: string
    required: false
    help: "Month in YYYY-MM format (default: current month)"
    pattern: "^\\d{4}-\\d{2}$"

columns:
  - name: projectId
    type: string
  - name: projectName
    type: string
  - name: activityNumber
    type: string
  - name: activityName
    type: string
  - name: category
    type: string
  - name: linePropertyId
    type: string

pipeline:
  - step: navigate
    url: "https://timetracking.mercedes-benz-techinnovation.com/"
  - step: wait
    selector: "body"
    timeout: 10000
  - step: js_evaluate
    file: timetracking-projects.eval.js
