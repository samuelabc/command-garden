site: jira
name: my-tickets
version: "2.0"
description: "Jira Cloud tickets assigned to the user — resolved, in-progress, and blockers"
access: read

domains:
  - "mercedes-benz.atlassian.net"
capabilities:
  - navigate
  - js_evaluate
  - network_egress

args:
  - name: fromDate
    type: string
    required: true
    help: "Start date in YYYY-MM-DD format"
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  - name: toDate
    type: string
    required: true
    help: "End date in YYYY-MM-DD format"
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  - name: assignee
    type: string
    required: false
    help: "Override assignee (Jira username or 'currentUser()'). Default: currentUser()"

columns:
  - name: key
    type: string
  - name: summary
    type: string
  - name: status
    type: string
  - name: type
    type: string
  - name: resolvedDate
    type: string
  - name: updatedDate
    type: string
  - name: staleDays
    type: number
  - name: category
    type: string

pipeline:
  - step: navigate
    url: "https://mercedes-benz.atlassian.net/"
  - step: wait
    selector: "body"
    timeout: 30000
  - step: js_evaluate
    file: jira-my-tickets.eval.js
