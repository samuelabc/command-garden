site: teams
name: rooms-availability
version: "1.0"
description: "Meeting-room free/busy timeline for multiple rooms on a given day (Teams/Outlook calendar)"
access: read
cdp: true

domains:
  - "outlook.cloud.microsoft"
  - "mcas-proxyweb.mcas.ms"
  - "outlook.cloud.microsoft.mcas.ms"
capabilities:
  - navigate
  - js_evaluate
  - cdp_attach

args:
  - name: rooms
    type: string
    required: true
    help: "Comma-separated room names, emails, or name:email pairs (e.g. 'MBTMY The Vista:RES-RERE-M6VJ7ZUW@mercedes-benz.com,MBTMY The Cliffside:res-rere-m6vjl2tw@mercedes-benz.com' for batch mode, or 'MBTMY The Vista,res-rere-m6vj7zuw@mercedes-benz.com' for sequential)"
  - name: date
    type: string
    required: false
    help: "Day to check in YYYY-MM-DD format (default: today)"
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"

columns:
  - name: roomName
    type: string
  - name: roomEmail
    type: string
  - name: date
    type: string
  - name: state
    type: string
  - name: start
    type: string
  - name: end
    type: string
  - name: durationMin
    type: number

pipeline:
  - step: navigate
    url: "https://outlook.cloud.microsoft/calendar/deeplink/compose"
  - step: wait
    selector: "body"
    timeout: 30000
  - step: js_evaluate
    file: teams-rooms-availability.eval.js
